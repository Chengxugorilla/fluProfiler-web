<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fluProfiler-web</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header>
      <strong>fluProfiler-web</strong>
      <nav>
        <a href="#home">首页</a>
        <a href="#fluAgPredictor">fluAgPredictor</a>
        <a href="#fluVacSelector">fluVacSelector</a>
        <a href="#fluAgEnhancer">fluAgEnhancer</a>
      </nav>
    </header>

    <main>
      <section id="home">
        <h1>fluProfiler-web</h1>
        <p>流感抗原分析工具，当前已开放 fluAgPredictor。</p>
      </section>

      <section id="fluAgPredictor">
        <h2>fluAgPredictor</h2>
        <p>输入血清和病毒的 HA、NA 序列及传代类型，查询 prediction 值。</p>

        <form id="query-form">
          <label>
            serumHA
            <input id="serumHA" name="serumHA" autocomplete="off" />
          </label>
          <label>
            serumNA
            <input id="serumNA" name="serumNA" autocomplete="off" />
          </label>
          <label>
            virusHA
            <input id="virusHA" name="virusHA" autocomplete="off" />
          </label>
          <label>
            virusNA
            <input id="virusNA" name="virusNA" autocomplete="off" />
          </label>
          <label>
            serumPassage
            <input id="serumPassage" name="serumPassage" autocomplete="off" />
          </label>
          <label>
            virusPassage
            <input id="virusPassage" name="virusPassage" autocomplete="off" />
          </label>

          <button type="submit">查询</button>
        </form>

        <p id="prediction">等待查询</p>
      </section>

      <section id="fluVacSelector">
        <h2>fluVacSelector</h2>
        <p>功能开发中。</p>
      </section>

      <section id="fluAgEnhancer">
        <h2>fluAgEnhancer</h2>
        <p>功能开发中。</p>
      </section>
    </main>
  </body>
</html>
